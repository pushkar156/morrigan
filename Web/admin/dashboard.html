<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Admin | Morrigan</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-body">
    <div class="hamburger" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar hidden">
        <a href="../index.html" class="sidebar-logo">
            <img src="../logo.png" alt="Morrigan">
            <span>MORRIGAN</span>
        </a>
        <nav>
            <div class="nav-section">
                <p class="nav-section-title">Content</p>
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="editor.html" class="nav-item">
                    <span class="nav-item-icon">✍️</span>
                    <span>New Article</span>
                </a>
            </div>
        </nav>
        <div class="nav-item logout-btn" onclick="logout()" style="margin-top: auto; color: #ff4d4d;">
            <span class="nav-item-icon">🚪</span>
            <span>Logout</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1 class="page-title">Editorial Control</h1>
                    <p class="page-subtitle">Manage your financial intelligence assets</p>
                </div>
                <a href="editor.html" class="btn-primary">
                    <span>+</span>
                    <span>New Article</span>
                </a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Articles</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Published</div>
                <div class="stat-value" id="publishedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Drafts</div>
                <div class="stat-value" id="draftCount">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2 class="table-title">Article Archives</h2>
            </div>
            <table class="blog-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="blogList">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <div>Synchronizing with database...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
        const API_BASE_URL = isLocal ? 'http://localhost:8000/api' : '/api';
        const token = localStorage.getItem('admin_token');

        if (!token) window.location.href = 'login.html';

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            const hamburger = document.querySelector('.hamburger');
            const mainContent = document.querySelector('.main-content');

            sidebar.classList.toggle('hidden');
            overlay.classList.toggle('active');
            hamburger.classList.toggle('active');
            mainContent.classList.toggle('sidebar-open');
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        async function fetchBlogs() {
            try {
                const res = await fetch(`${API_BASE_URL}/blogs/admin/all`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    if (res.status === 401) logout();
                    throw new Error('Unauthorized');
                }
                const blogs = await res.json();
                updateStats(blogs);
                renderBlogs(blogs);
            } catch (err) {
                document.getElementById('blogList').innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <div style="color: #ff4d4d;">Failed to load library</div>
                        </td>
                    </tr>`;
            }
        }

        function updateStats(blogs) {
            const total = blogs.length;
            const published = blogs.filter(b => b.status === 'published').length;
            const drafts = total - published;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('publishedCount').textContent = published;
            document.getElementById('draftCount').textContent = drafts;
        }

        function renderBlogs(blogs) {
            const tbody = document.getElementById('blogList');

            if (blogs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <div>Library is empty. Start your first draft.</div>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = '';
            blogs.forEach(blog => {
                const tr = document.createElement('tr');
                const date = new Date(blog.published_at || blog.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
                const statusClass = blog.status === 'published' ? 'status-published' : 'status-draft';
                const categoryDisplay = blog.category ? blog.category.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : '-';

                tr.innerHTML = `
                    <td><div class="blog-title">${blog.title}</div></td>
                    <td><span class="status-badge ${statusClass}">${blog.status}</span></td>
                    <td><span class="category-tag">${categoryDisplay}</span></td>
                    <td>${date}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="location.href='editor.html?slug=${blog.slug}'" title="Edit">Edit</button>
                            <button class="action-btn delete" onclick="deleteBlog(${blog.id})" title="Delete">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteBlog(id) {
            if (!confirm('Permanent deletion of this asset? This cannot be undone.')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/blogs/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) fetchBlogs();
            } catch (err) {
                alert('Deletion failed. Check permissions.');
            }
        }

        // Sync Hamburger active state based on sidebar
        window.addEventListener('load', () => {
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar.classList.contains('hidden')) {
                document.querySelector('.hamburger').classList.add('active');
            }
        });

        fetchBlogs();
    </script>
</body>

</html>
