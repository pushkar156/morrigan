<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor | Morrigan Admin</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>

<body class="admin-body">
    <div class="hamburger" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar hidden">
        <a href="../index.html" class="sidebar-logo">
            <img src="../logo.png" alt="Morrigan">
            <span>MORRIGAN</span>
        </a>
        <nav>
            <div class="nav-section">
                <p class="nav-section-title">Content</p>
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-item-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="editor.html" class="nav-item active">
                    <span class="nav-item-icon">✍️</span>
                    <span>New Article</span>
                </a>
            </div>
        </nav>
        <div class="nav-item logout-btn" onclick="logout()" style="margin-top: auto; color: #ff4d4d;">
            <span class="nav-item-icon">🚪</span>
            <span>Logout</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="editor-header">
            <h1 class="page-title" id="pageTitle">Draft Intelligence</h1>
            <span class="status-msg" id="statusMsg"></span>
        </div>

        <div class="editor-container">
            <div class="form-grid">
                <div>
                    <div class="form-section-title">Article Details</div>
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" id="title" class="form-control"
                            placeholder="The Future of Venture Capital...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Excerpt</label>
                        <textarea id="excerpt" class="form-control" rows="4"
                            placeholder="A brief summary for the preview card..."></textarea>
                    </div>
                </div>
                <div>
                    <div class="form-section-title">Settings</div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="category" class="form-select">
                            <option value="back-to-basics">Back to Basics</option>
                            <option value="case-studies">Case Studies</option>
                            <option value="stock-analysis">Stock Analysis</option>
                            <option value="100-days-challenge">100 Days Challenge</option>
                            <option value="ma-diaries">M&A Diaries</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Publish Date</label>
                        <input type="datetime-local" id="publishedAt" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Featured Image</label>
                        <select id="imgSource" class="form-select" onchange="toggleImgInput()"
                            style="margin-bottom: 0.75rem;">
                            <option value="url">Image URL</option>
                            <option value="upload">Local Upload</option>
                        </select>
                        <input type="text" id="image" class="form-control"
                            placeholder="https://images.unsplash.com/...">
                        <div id="uploadContainer" class="upload-container"
                            style="display: none; margin-top: 0.75rem; gap: 0.75rem;">
                            <input type="file" id="imgUpload" class="form-control" accept="image/*">
                            <button type="button" onclick="uploadFeatured()" class="btn-upload"
                                style="background: var(--accent); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-weight: 700; cursor: pointer;">Upload</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Content</label>
                <div id="editor"></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="location.href='dashboard.html'">Discard Changes</button>
                <button class="btn btn-primary" onclick="saveBlog()">Secure Archive</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <script>
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
        const API_BASE_URL = isLocal ? 'http://localhost:8000/api' : '/api';
        const token = localStorage.getItem('admin_token');
        let currentBlogId = null;

        if (typeof ImageResize !== 'undefined') Quill.register('modules/imageResize', ImageResize);

        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    ['link', 'image', 'blockquote'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    ['clean']
                ],
                imageResize: { displaySize: true }
            }
        });

        quill.getModule('toolbar').addHandler('image', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.click();
            input.onchange = async () => {
                const formData = new FormData();
                formData.append('file', input.files[0]);
                const res = await fetch(`${API_BASE_URL}/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                const range = quill.getSelection();
                quill.insertEmbed(range.index, 'image', data.url);
            };
        });

        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        if (slug) loadBlog(slug);

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            const hamburger = document.querySelector('.hamburger');
            const mainContent = document.querySelector('.main-content');

            sidebar.classList.toggle('hidden');
            overlay.classList.toggle('active');
            hamburger.classList.toggle('active');
            mainContent.classList.toggle('sidebar-open');
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'login.html';
        }

        async function loadBlog(slug) {
            const res = await fetch(`${API_BASE_URL}/blogs/${slug}`);
            const blog = await res.json();
            currentBlogId = blog.id;
            document.getElementById('title').value = blog.title;
            document.getElementById('category').value = blog.category;
            document.getElementById('status').value = blog.status;
            document.getElementById('image').value = blog.featured_image || '';
            document.getElementById('excerpt').value = blog.excerpt || '';
            if (blog.published_at) document.getElementById('publishedAt').value = blog.published_at.slice(0, 16);
            quill.root.innerHTML = blog.content;
            document.getElementById('pageTitle').innerText = 'Edit Asset';
        }

        function toggleImgInput() {
            const isUpload = document.getElementById('imgSource').value === 'upload';
            const uploadContainer = document.getElementById('uploadContainer');
            uploadContainer.style.display = isUpload ? 'flex' : 'none';
        }

        async function uploadFeatured() {
            const file = document.getElementById('imgUpload').files[0];
            if (!file) {
                alert('Select an image asset first');
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(`${API_BASE_URL}/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            const data = await res.json();
            document.getElementById('image').value = data.url;
            document.getElementById('statusMsg').textContent = '✓ Asset uploaded';
            setTimeout(() => { document.getElementById('statusMsg').textContent = ''; }, 3000);
        }

        async function saveBlog() {
            const title = document.getElementById('title').value;
            if (!title) { alert('Intelligence needs a title.'); return; }

            const data = {
                title: title,
                category: document.getElementById('category').value,
                content: quill.root.innerHTML,
                excerpt: document.getElementById('excerpt').value,
                status: document.getElementById('status').value,
                featured_image: document.getElementById('image').value,
                published_at: document.getElementById('publishedAt').value || null
            };

            const method = currentBlogId ? 'PUT' : 'POST';
            const url = currentBlogId ? `${API_BASE_URL}/blogs/${currentBlogId}` : `${API_BASE_URL}/blogs`;

            try {
                const res = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('statusMsg').textContent = '✓ Securely saved';
                    setTimeout(() => { location.href = 'dashboard.html'; }, 1500);
                } else {
                    alert('Save failed. Authorization required.');
                }
            } catch (err) {
                alert('Network anomaly detected during save.');
            }
        }
    </script>
</body>

</html>
